# Package settings. Use "pip install ." to install the tool.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-opportunity-audit"
dynamic = ["version"]
description = "Find where AI can help a small business, and what to do first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "salaramini1993" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
]

# The "aiaudit" command runs aiaudit.cli:main.
[project.scripts]
aiaudit = "aiaudit.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/salaramini1993/ai-opportunity-audit"

[tool.setuptools]
packages = ["aiaudit"]

# Include the catalog data file in the package.
[tool.setuptools.package-data]
aiaudit = ["data/*.json"]

[tool.setuptools.dynamic]
version = { attr = "aiaudit.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
